apiVersion: apps/v1
kind: Deployment
metadata:
  name: rish-sample-node-app
  labels:
    app: rish-sample-node-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rish-sample-node-app
  template:
    metadata:
      labels:
        app: rish-sample-node-app
    spec:
      containers:
        - name: rish-sample-node-app
          image: rish-sample-node-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
